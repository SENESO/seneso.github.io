name: Update site statistics

# Regenerates data/stats.json (+ data/stats.js) from the GitHub API and a
# per-language line count of every repository, then commits the result.
# The site is static: it simply re-renders from the fresh data file.
#
# Requires one repository secret:
#   STATS_TOKEN — a fine-grained personal access token for the SENESO account
#                 with read access to all repositories (Contents: read) so
#                 private repositories can be counted too. Without it the
#                 workflow falls back to public data only.

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate statistics
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_stats.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json data/stats.js
          if git diff --cached --quiet; then
            echo "Statistics unchanged — nothing to commit."
          else
            git commit -m "chore: refresh site statistics"
            git push
          fi
